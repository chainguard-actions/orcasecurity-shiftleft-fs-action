name: Test basic scan invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        # No real Orca API token is available in the harness, so the CLI is
        # expected to fail authentication; we verify the action handles it.
        continue-on-error: true
        with:
          api_token: dummy-orca-token
          project_key: test-project
          path: .
          show_annotations: "false"
          disable_err_report: "true"
          no_color: "true"
          timeout: 2m
      - name: Assert action ran the scan and reported a consistent exit code
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$EXIT_CODE" != "0" ]; then
              echo "FAIL: action succeeded but exit_code is '$EXIT_CODE' (expected 0)"
              exit 1
            fi
            echo "PASS: scan succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" = "0" ]; then
              echo "FAIL: action failed but reported exit_code 0"
              exit 1
            fi
            echo "PASS: scan failed gracefully (no valid Orca token in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
