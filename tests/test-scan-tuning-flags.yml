name: Test scan with tuning flags (exit_code, num_cpu, max_secret, exclude_paths, display_name, log_path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare log directory and excluded path
        run: |
          mkdir -p orca-test-logs orca-test-excluded
          echo "placeholder" > orca-test-excluded/file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: invalid-orca-token-for-testing
          project_key: test-project
          path: .
          exit_code: "7"
          num_cpu: "2"
          max_secret: "5"
          exclude_paths: "./orca-test-excluded/,example.tf"
          display_name: act-harness-tuning-scan
          log_path: orca-test-logs
          no_color: "true"
          disable_err_report: "true"
          show_annotations: "false"
          timeout: 2m
      - name: Assert scan was invoked and exit_code output reported
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if ! echo "$EXIT_CODE" | grep -qE '^[0-9]+$'; then
            echo "FAIL: exit_code output missing or not numeric"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            if [ "$EXIT_CODE" != "0" ]; then
              echo "FAIL: step succeeded but exit_code is $EXIT_CODE"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            if [ "$EXIT_CODE" = "0" ]; then
              echo "FAIL: step failed but exit_code is 0"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
